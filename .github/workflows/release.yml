name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # dry run: builds and uploads the signed APK as an artifact, no GitHub Release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${{ steps.ver.outputs.code }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Imprima-${{ steps.ver.outputs.name }}.apk"
          (cd dist && sha256sum "Imprima-${{ steps.ver.outputs.name }}.apk" > "Imprima-${{ steps.ver.outputs.name }}.apk.sha256")

      # The signing certificate fingerprint is public information (anyone can read it from the
      # APK). Logging it lets you confirm the right keystore was used without exposing secrets.
      - name: Verify signature and print certificate fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/Imprima-${{ steps.ver.outputs.name }}.apk" | grep -i "SHA-256"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep -i "SHA.256"

      - uses: actions/upload-artifact@v4
        with:
          name: imprima-release-apk
          path: android/dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/* \
            --title "Imprima ${{ steps.ver.outputs.name }}" --generate-notes
