name: RasaPrinter
options:
  bundleIdPrefix: com.rasa
  deploymentTarget:
    iOS: "17.0"
packages:
  RasaPrinterCore:
    path: ..
targets:
  RasaPrinter:
    type: application
    platform: iOS
    sources:
      - RasaPrinter
    dependencies:
      - package: RasaPrinterCore
    info:
      path: RasaPrinter/Info.plist
      properties:
        CFBundleDisplayName: Rasa Printer
        NSLocalNetworkUsageDescription: Rasa Printer advertises itself as a network printer so other devices can print to it.
        NSBonjourServices:
          - _ipp._tcp
          - _universal._sub._ipp._tcp
          - _print._sub._ipp._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rasa.printer
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
