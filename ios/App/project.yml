name: Imprima
options:
  developmentLanguage: en
  bundleIdPrefix: com.imprima
  deploymentTarget:
    iOS: "17.0"
packages:
  ImprimaCore:
    path: ..
targets:
  Imprima:
    type: application
    platform: iOS
    sources:
      - Imprima
    dependencies:
      - package: ImprimaCore
    info:
      path: Imprima/Info.plist
      properties:
        CFBundleDisplayName: Imprima
        NSLocalNetworkUsageDescription: Imprima advertises itself as a network printer so other devices can print to it.
        NSBonjourServices:
          - _ipp._tcp
          - _universal._sub._ipp._tcp
          - _print._sub._ipp._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.utatane.imprima
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
